name: Build Check

on:
  pull_request:
    branches: [ main, develop, master ]
  push:
    branches: [ main, develop, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5.1.0

    - name: Use Node.js 22
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Install test browser
      run: npx playwright install --with-deps chromium

    - name: Run browser regressions
      run: npm run test:e2e

    - name: Upload browser failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-regressions
        path: |
          playwright-report/
          test-results/
        retention-days: 7

    - name: Check if build artifacts exist
      run: |
        if [ -d "dist" ]; then
          echo "✅ Build successful - dist folder created"
          ls -la dist/
        else
          echo "❌ Build failed - dist folder not found"
          exit 1
        fi
